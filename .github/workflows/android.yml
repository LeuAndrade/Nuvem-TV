name: Gerar APK BXbox Cloud TV

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v6

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Preparar SDK Android existente
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --licenses < <(yes) > /dev/null
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Verificar protocolo WebView
        run: node tools/test-player.cjs

      - name: Testar, verificar e compilar
        run: bash gradlew :app:testLiteUnitTest :app:lintLite :app:assembleLite --no-daemon

      - name: Incluir o codigo correspondente
        run: git archive --format=zip --output=fonte-correspondente.zip HEAD

      - name: Disponibilizar APKs e codigo
        uses: actions/upload-artifact@v6
        with:
          name: BXboxCloudTV-APKs-e-codigo
          path: |
            app/build/outputs/apk/lite/*.apk
            fonte-correspondente.zip
          if-no-files-found: error
          retention-days: 30

      - name: Disponibilizar relatorios
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: BXboxCloudTV-verificacoes
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
